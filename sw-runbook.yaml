  - type: Heading
    level: H2
    title: Introduce the issue-readiness skill

  - type: Markdown
    contents: |
      Build and merge a repository-local skill that assesses whether a GitHub issue
      is sufficiently clear to implement. The skill should identify missing
      acceptance criteria, assumptions, dependencies, and test expectations before
      an implementation agent starts work.

  - type: Markdown
    contents: Create the issue-readiness skill issue.
    indent: 3

  - type: Command
    commands: |
      gh issue create \
        --title 'Create review issue-readiness skill' \
        --body-file '../fixtures/issues/ISSUE-014-create-review-issue-readiness-skill.md'

  - type: Markdown
    contents: Build, verify, commit, and push the issue-readiness skill branch.
    indent: 3

  - type: Command
    commands: |
      git switch --create '014-create-review-issue-readiness-skill'
      rsync --archive '../fixtures/repository-overlays/014-create-review-issue-readiness-skill/' .
      ./mvnw clean verify
      git add .
      git commit \
        --message 'Add issue-readiness review skill' \
        --message 'Refs #14.' \
        --message 'Adds a repository-local skill for assessing GitHub issue implementation readiness, including staged clarification and explicit readiness recommendations.' \
        --message 'Includes discoverable skill metadata and documentation for invoking the skill before implementation begins.'
      git push --set-upstream origin '014-create-review-issue-readiness-skill'
    indent: 3

  - type: Markdown
    contents: Open the issue-readiness skill pull request.
    indent: 3

  - type: Command
    commands: |
      gh pr create \
        --title 'Add issue-readiness review skill' \
        --body-file '../fixtures/pr/PR-014-create-review-issue-readiness-skill.md' \
        > '../fixtures/pr/PR-014-create-review-issue-readiness-skill.out'
    indent: 3

  - type: Markdown
    contents: Wait for issue-readiness skill checks, then merge the pull request.
    indent: 3

  - type: Command
    commands: |
      ../tools/merge-pull-request.sh '../fixtures/pr/PR-014-create-review-issue-readiness-skill.out'
    timeout: 10 minutes
    indent: 3

  - type: Heading
    level: H2
    title: Use the issue-readiness skill to review issue 4

  - type: Markdown
    contents: |
      Capture the output that Codex produces outside the repository so that these do not impact the subsequent interactions with Codex. 

  - type: Command
    commands: |
      mkdir '../codex'
    indent: 3

  - type: Markdown
    contents: |
      Use the Codex CLI to invoke `$review-issue-readiness` for issue 4: guest pickup checkout and order confirmation. Resolve any required clarifications before proceeding. The outcome must be an explicit readiness recommendation, not an implicit assumption that the issue is implementable.

  - type: Command
    commands: |
      codex exec \
        --ephemeral \
        --sandbox read-only \
        --model gpt-5.6-luna \
        --config 'model_reasoning_effort="low"' \
        --output-last-message '../codex/codex-review-issue-readiness-issue-004.md' \
        - <<'EOF' > '../codex/codex-review-issue-readiness-issue-004.log' 2>&1
      Use $review-issue-readiness to assess whether this issue is ready to implement: https://github.com/albertattard/demo-supermarket/issues/4
      EOF
    timeout: 2 minutes
    indent: 3

  - type: Markdown
    contents: |
      Note that the issue is incomplete and requires some grooming before moving forward as indicated in the response.  

  - type: DisplayFile
    path: ../codex/codex-review-issue-readiness-issue-004.md

  - type: Markdown
    contents: |
      This is just the first iteration. [Issue 4](https://github.com/albertattard/demo-supermarket/issues/4) is not yet ready and requires further grooming. This process can be made interactive and you can answer the model's questions and update the issue in the process.

      The fixtures contain a groom issue which will address all issues which you can use. Update the issue.

  - type: Command
    commands: |
      gh issue edit 4 \
        --repo albertattard/demo-supermarket \
        --body-file '../fixtures/issues/ISSUE-004-guest-checkout-and-order-confirmation-groomed.md'

  - type: Markdown
    contents: |
      Verify that now the issue is properly groomed and we can proceed with the implementation.

  - type: Command
    commands: |
      codex exec \
        --ephemeral \
        --sandbox read-only \
        --model gpt-5.6-luna \
        --config 'model_reasoning_effort="low"' \
        --output-last-message '../codex/codex-review-issue-readiness-issue-004-groomed.md' \
        - <<'EOF' > '../codex/codex-review-issue-readiness-issue-004-groomed.log' 2>&1
      Use $review-issue-readiness to assess whether this issue is ready to implement: https://github.com/albertattard/demo-supermarket/issues/4
      EOF
    timeout: 2 minutes
    indent: 3

  - type: Markdown
    contents: |
      According to the skill and model, [Issue 4](https://github.com/albertattard/demo-supermarket/issues/4) is now ready to be worked on.   

  - type: DisplayFile
    path: ../codex/codex-review-issue-readiness-issue-004-groomed.md

  - type: Heading
    level: H2
    title: Introduce the implementation skills

  - type: Markdown
    contents: |
      Build and merge repository-local skills that implement a ready GitHub issue or orchestrate meaningful, isolated implementation candidates. The skills must distinguish issue facts from repository evidence, keep implementation within the issue's scope, add or update tests, run relevant verification, and report assumptions and remaining risks.

  - type: Markdown
    contents: Create the implementation skills issue.
    indent: 3

  - type: Command
    commands: |
      gh issue create \
        --title 'Create issue implementation skills' \
        --body-file '../fixtures/issues/ISSUE-015-create-implement-issue-skill.md'
    indent: 3

  - type: Markdown
    contents: Build, verify, commit, and push the implementation skills branch.
    indent: 3

  - type: Command
    commands: |
      git switch --create '015-create-implementation-skills'
      rsync --archive '../fixtures/repository-overlays/015-create-implement-issue-skill/' .
      ./mvnw clean verify
      git add .
      git commit \
        --message 'Add issue implementation skills' \
        --message 'Refs #15.' \
        --message 'Adds repository-local skills for focused issue implementation and orchestrating isolated implementation candidates with relevant tests, verification, and explicit reporting of assumptions and risks.' \
        --message 'Includes discoverable skill metadata and documentation for invoking both workflows after issue readiness review.'
      git push --set-upstream origin '015-create-implementation-skills'
    indent: 3

  - type: Markdown
    contents: Open the implementation skills pull request.
    indent: 3

  - type: Command
    commands: |
      gh pr create \
        --title 'Add issue implementation skills' \
        --body-file '../fixtures/pr/PR-015-create-implement-issue-skill.md' \
        > '../fixtures/pr/PR-015-create-implement-issue-skill.out'
    indent: 3

  - type: Markdown
    contents: Wait for implementation skills checks, then merge the pull request.
    indent: 3

  - type: Command
    commands: |
      ../tools/merge-pull-request.sh '../fixtures/pr/PR-015-create-implement-issue-skill.out'
    timeout: 10 minutes
    indent: 3

  - type: Markdown
    contents: |
      Create two isolated worktrees from the same main-branch commit. The primary worktree holds the simplest design consistent with repository conventions; the alternative worktree holds a genuinely different viable design, or remains unchanged when no useful alternative exists.

  - type: Command
    commands: |
      base_commit="$(git rev-parse HEAD)"

      for candidate in primary alternative; do
        branch="issue-4-${candidate}"
        worktree="../repository-worktree-issue-4-${candidate}"

        if git show-ref --verify --quiet "refs/heads/${branch}" || [ -e "${worktree}" ]; then
          echo "Candidate branch or worktree already exists: ${branch} / ${worktree}" >&2
          exit 1
        fi
      done

      git worktree add -b 'issue-4-primary'     '../repository-worktree-issue-4-primary'     "${base_commit}"
      git worktree add -b 'issue-4-alternative' '../repository-worktree-issue-4-alternative' "${base_commit}"
    indent: 3

  - type: Markdown
    contents: |
      Use the orchestrator to coordinate the primary and alternative implementations in their prepared worktrees.

      ```text
      Use $orchestrate-issue-implementations for https://github.com/albertattard/demo-supermarket/issues/4.
      ```
    indent: 3

  - type: Breakpoint

  - type: Markdown
    contents: Commit each candidate that changed. The alternative worktree may remain unchanged when no useful alternative exists.
    indent: 3

  - type: Command
    commands: |
      for candidate in primary alternative; do
        worktree="../repository-worktree-issue-4-${candidate}"

        if [ -n "$(git -C "${worktree}" status --short)" ]; then
          git -C "${worktree}" add .
          git -C "${worktree}" commit \
            --message "Implement guest pickup checkout and order confirmation (${candidate})" \
            --message 'Refs #4.'
        else
          echo "No changes to commit for ${candidate}."
        fi
      done
    indent: 3

  - type: Heading
    level: H2
    title: Review competing implementations of issue 4

  - type: Markdown
    contents: |
      Introduce an independent review skill that examines every candidate in its isolated worktree. It must compare the implementations against issue 4's acceptance criteria, automated-test coverage, maintainability, and regressions, then recommend exactly one candidate for merge.

