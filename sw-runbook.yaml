  - type: Heading
    level: H2
    title: Use the issue-readiness skill to review issue 4

  - type: Markdown
    contents: |
      In Codex, invoke `$review-issue-readiness` for issue 4: guest checkout and
      order confirmation. Resolve any required clarifications before proceeding.
      The outcome must be an explicit readiness recommendation, not an implicit
      assumption that the issue is implementable.

  - type: Heading
    level: H2
    title: Introduce implementation agents and Git worktrees

  - type: Markdown
    contents: |
      Introduce a second skill that implements a ready issue and explain how Git
      worktrees isolate parallel work. For issue 4, assign each implementation
      agent a distinct brief or evaluation focus; asking several agents to solve an
      identical prompt would mostly produce redundant candidates.

      TODO: Add the implementation skill, worktree setup, distinct agent briefs,
      and one branch or pull request per candidate implementation.

  - type: Heading
    level: H2
    title: Review competing implementations of issue 4

  - type: Markdown
    contents: |
      Introduce an independent review skill that examines every candidate in its
      isolated worktree. It must compare the implementations against issue 4's
      acceptance criteria, automated-test coverage, maintainability, and
      regressions, then recommend exactly one candidate for merge.

      TODO: Add the review skill, review commands, selected-candidate merge, and
      cleanup of unselected worktrees and branches.
