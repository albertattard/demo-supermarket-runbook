entries:
  - type: Heading
    level: H1
    title: Supermarket

  - type: Heading
    level: H2
    title: Project boostrap

  - type: Markdown
    contents: Start by bootstrapping the project and creating the repository, issues, and start by implementing the first three issues. No AI is involved in the project bootstrapping. All the needed resources are found in the `fixtures` directory which is outside of this repository.

  - type: Markdown
    contents: 1. Create the repository

  - type: Markdown
    contents: Copy the repository README and license into the working directory.
    indent: 3

  - type: Command
    commands: |
      cp '../fixtures/README.md'      .
      cp '../fixtures/LICENSE'        .
      cp '../fixtures/.editorconfig'  .
      cp '../fixtures/.gitattributes' .
      cp '../fixtures/.gitignore'     .
    indent: 3

  - type: Markdown
    contents: Initialize Git and commit the seed documentation.
    indent: 3

  - type: Command
    commands: |
      git init
      git add .
      git commit -m 'Initial commit'
    indent: 3

  - type: Markdown
    contents: Delete any existing generated `demo-supermarket` GitHub repository.
    indent: 3

  - type: Command
    commands: |
      if gh repo view 'demo-supermarket' >/dev/null 2>&1; then
        gh repo delete 'demo-supermarket' --yes
      fi
    indent: 3

  - type: Markdown
    contents: Create the public GitHub repository and push the initial commit.
    indent: 3

  - type: Command
    commands: |
      gh repo create 'demo-supermarket' \
        --public \
        --source=. \
        --remote=origin \
        --push
    indent: 3

  - type: Markdown
    contents: Protect `main` so later changes must merge through passing pull requests.
    indent: 3

  - type: Command
    commands: |
      owner="$(gh repo view 'demo-supermarket' --json owner --jq '.owner.login')"

      gh api \
        --method PUT \
        "repos/${owner}/demo-supermarket/branches/main/protection" \
        --input - <<'JSON'
      {
        "required_status_checks": {
          "strict": true,
          "contexts": [
            "verify"
          ]
        },
        "enforce_admins": true,
        "required_pull_request_reviews": {
          "required_approving_review_count": 0,
          "dismiss_stale_reviews": true,
          "require_code_owner_reviews": false
        },
        "restrictions": null,
        "required_linear_history": false,
        "allow_force_pushes": false,
        "allow_deletions": false,
        "block_creations": false,
        "required_conversation_resolution": true,
        "lock_branch": false,
        "allow_fork_syncing": false
      }
      JSON
    indent: 3

  - type: Markdown
    contents: Invite others to collaborate.
    indent: 3

  - type: Command
    commands: |
      # owner="$(gh repo view 'demo-supermarket' --json owner --jq '.owner.login')"

      # gh api \
      #   --method PUT \
      #   "repos/${owner}/demo-supermarket/collaborators/KristofBaetz" \
      #   --raw-field permission=push
    indent: 3

