entries:
  - type: Heading
    level: H1
    title: Demo Supermarket workshop

  - type: Markdown
    contents: |
      Work in your fork of `demo-supermarket-starter`. The canonical task files in
      `docs/tasks/` are the workshop briefs. Read them, but do not edit them, open
      pull requests, push branches, or merge pull requests. All workshop output stays
      in your local clone.

      This guide is published to the canonical starter repository by the facilitator
      after baseline provisioning. It is generated Markdown, not a Sociable Weaver
      source file in your clone.

  - type: Heading
    level: H2
    title: Prerequisites

  - type: Markdown
    contents: |
      You need Java 25 or newer, Git, and an authenticated GitHub CLI session. Your
      GitHub account must be able to create a fork of the canonical starter repository.
      These checks run when the facilitator publishes this guide; use them as the
      required local setup for the workshop.

  - type: Prerequisite
    checks:
      - kind: java
        name: Java 25+
        version: 25+
        contents: |
          Java 25 or newer is required to run the application's Maven verification.
        help: Install Java 25 or newer and make sure `java` is available on the PATH.
      - kind: command
        name: Git
        contents: |
          Git manages the local branches, worktrees, and commits created during the workshop.
        commands: |
          git --version
        assert:
          exit_code: 0
        help: Install Git and make sure `git` is available on the PATH.
      - kind: command
        name: Authenticated GitHub CLI
        contents: |
          The GitHub CLI creates the attendee fork and clone.
        commands: |
          gh auth status --active
        assert:
          exit_code: 0
        help: Authenticate the GitHub CLI with an account that can fork the canonical starter repository.

  - type: Heading
    level: H2
    title: Fork and clone the starter repository

  - type: Markdown
    contents: |
      Start by forking the starter project from
      [albertattard/demo-supermarket-starter](https://github.com/albertattard/demo-supermarket-starter).
      This gives you an independent copy for the workshop.

      If you are repeating the workshop, delete the previous fork and its local clone
      first. Replace `YOUR-GITHUB-LOGIN` with your GitHub account name. The local
      deletion is destructive: run it only from the directory that contains the clone,
      never from inside it.

  - type: Markdown
    contents: |
      Login to GH if you have not already done so and follow the provided instructions

      ```shell
      gh auth login \
        --hostname github.com \
        --web \
        --git-protocol ssh \
        --skip-ssh-key
      ```

      If already logged in, make sure you are using the right account

  - type: Command
    commands: |
      gh auth switch \
        --hostname github.com \
        --user albertattard-gh-test
    cleanup: |
      gh auth switch --hostname github.com --user albertattard

  - type: Command
    commands: |
      gh auth status
    output:
      caption: |
        TODO: Update the caption

  - type: Command
    commands: |
      owner="$(gh api user --jq '.login')"
      gh repo delete "${owner}/demo-supermarket" --yes 2>/dev/null || true
      rm -rf './demo-supermarket'

  - type: Markdown
    contents: |
      Fork the canonical starter [repository link](https://github.com/albertattard/demo-supermarket-starter), then clone your fork.

  - type: Command
    commands: |
      gh repo fork albertattard/demo-supermarket-starter \
        --fork-name demo-supermarket \
        --clone

  - type: Markdown
    contents: |
      Require passing verification and pull requests on `main`.

  - type: Command
    commands: |
      owner="$(gh repo view 'demo-supermarket' --json owner --jq '.owner.login')"
      gh api --method PUT "repos/${owner}/demo-supermarket/branches/main/protection" --input - <<'JSON'
      {
        "required_status_checks": {
          "strict": true,
          "contexts": [
            "verify"
          ]
        },
        "enforce_admins": true,
        "required_pull_request_reviews": {
          "required_approving_review_count": 0,
          "dismiss_stale_reviews": true,
          "require_code_owner_reviews": false
        },
        "restrictions": null,
        "required_linear_history": false,
        "allow_force_pushes": false,
        "allow_deletions": false,
        "block_creations": false,
        "required_conversation_resolution": true,
        "lock_branch": false,
        "allow_fork_syncing": false
      }
      JSON

  - type: ChangeDirectory
    path: demo-supermarket
    contents: |
      Work in the cloned fork for the remaining application steps.

  - type: Heading
    level: H2
    title: Build the application

  - type: Command
    commands: |
      ./mvnw clean verify

  - type: Breakpoint

  - type: Heading
    level: H2
    title: Read task 4 and assess readiness

  - type: Markdown
    contents: |
      Open the canonical task brief from your clone:

      ```shell
      sed -n '1,240p' docs/tasks/TASK-004-guest-checkout-and-order-confirmation.md
      ```

      Read `docs/tasks/TASK-014-create-review-issue-readiness-skill.md`,
      then create a local `review-issue-readiness` skill on a branch such as
      `workshop/task-readiness`. It should distinguish task facts from repository
      evidence, name missing acceptance criteria and test expectations, and finish
      with `READY`, `READY_WITH_ASSUMPTIONS`, or `BLOCKED`. Commit the skill locally.

      Use that skill to review task 4. Save its report outside the repository (for
      example, in a temporary directory) so it does not pollute the implementation
      diff. Treat the first review as blocked: task 4 deliberately leaves important
      public order-confirmation decisions unresolved.

  - type: Heading
    level: H2
    title: Instructor-led grooming pause

  - type: Markdown
    contents: |
      Stop here. The instructor now resolves task 4's open questions during the live
      grooming discussion. Attendees do not edit the canonical task file.

      Record the resolved decisions alongside the task facts in your saved review
      report, then repeat the readiness assessment. Do not treat a decision as
      resolved unless the instructor has confirmed it.

      Record the explicit readiness decision, assumptions, and remaining risks in
      the saved review report.

  - type: Heading
    level: H2
    title: Prepare local implementation candidates

  - type: Markdown
    contents: |
      Read `docs/tasks/TASK-015-create-implement-issue-skill.md`, then
      create local skills for focused issue implementation, candidate orchestration,
      and independent implementation review. Each must keep work within the groomed
      task scope, preserve task facts separately from repository evidence, require
      relevant tests, and report assumptions and risks. Commit these skills locally
      on a branch such as `workshop/implementation-skills`.

      Create two local worktrees from the same `main` commit. The primary candidate
      uses the simplest design consistent with the application; the alternative must
      be genuinely different or remain unchanged when no useful alternative exists.

      ```shell
      base_commit="$(git rev-parse main)"
      git worktree add -b task-4-primary ../demo-supermarket-starter-task-4-primary "${base_commit}"
      git worktree add -b task-4-alternative ../demo-supermarket-starter-task-4-alternative "${base_commit}"
      ```

      Implement and verify each candidate locally. Commit only candidates that
      changed. Do not push them or create pull requests.

  - type: Heading
    level: H2
    title: Review and select locally

  - type: Markdown
    contents: |
      Independently review each changed candidate against the refreshed canonical
      task, the shared base commit, its diff, and verification evidence. The review
      verdict must be `ACCEPT`, `CHANGES_REQUESTED`, or `BLOCKED`; it does not choose
      the winner. Give a candidate with requested changes one repair cycle and repeat
      the review.

      Select the accepted candidate with the clearest evidence and merge it locally
      into your local `main` branch. Re-run the full verification, then retain the
      commit hash and evidence for the workshop discussion. This merge is deliberately
      local: there is no shared attendee branch, pull request, or upstream change.

      ```shell
      git switch main
      git merge --no-ff task-4-primary
      ./mvnw clean verify
      git log -1 --oneline
      ```

      If the alternative is selected, replace `task-4-primary` with its branch name.
      Remove the temporary worktrees only after the discussion has finished.
