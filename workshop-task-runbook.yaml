      codex exec \
        --ephemeral \
        --sandbox read-only \
        --model 'gpt-5.6-luna' \
        --config 'model_reasoning_effort="low"' \
        --output-last-message '/tmp/codex-next-task.md' \
        - <<'EOF' > '/tmp/codex-next-task.log' 2>&1
      Which issue should we work on next?
      EOF
