entries:
  - type: Heading
    level: H1
    title: Demo Supermarket starter provisioning

  - type: Markdown
    contents: |
      Facilitator-only workflow for recreating the disposable `demo-supermarket-starter`
      repository. It prepares the baseline application and the canonical task
      backlog before the workshop.

  - type: Heading
    level: H2
    title: Prerequisites

  - type: Markdown
    contents: |
      Run this only from a clean, disposable working directory. It deletes and recreates the `demo-supermarket-starter` GitHub repository. You need Java 25 or newer, Git, and an authenticated GitHub CLI session with permission to create and delete repositories.

  - type: Prerequisite
    checks:
      - kind: java
        name: Java 25+
        version: 25+
        contents: |
          Java 25 or newer is required by the generated Spring Boot project.
        help: Install Java 25 or newer and make sure `java` is available on the PATH.
      - kind: command
        name: Git
        contents: |
          Git creates the local history for the baseline.
        commands: |
          git --version
        assert:
          exit_code: 0
        help: Install Git and make sure `git` is available on the PATH.
      - kind: command
        name: Authenticated GitHub CLI
        contents: |
          The GitHub CLI creates and administers the disposable repository after the
          local baseline is complete.
        commands: |
          gh auth status --active
        assert:
          exit_code: 0
        help: Authenticate the GitHub CLI with an account that has the required repository administration permissions.

  - type: Heading
    level: H2
    title: Create the starter repository

  - type: Markdown
    contents: |
      The generated repository receives application files and normal project documentation only; runbook sources remain outside it.

  - type: Command
    commands: |
      rsync --archive '../fixtures/repository-overlays/000-starter/' .

      git init
      git add .
      git diff --cached --check
      git commit \
        --message 'Initial commit' \
        --message 'Establish the repository baseline so the workshop starts from a consistent, documented, and licensed project.'

  - type: Markdown
    contents: |
      Apply each overlay directly on the local default branch. Each commit is a verified, coherent starter state. These are facilitator provisioning actions, not attendee instructions.

  - type: Command
    commands: |
      rsync --archive '../fixtures/repository-overlays/001-project-foundation/' .

      git add .
      git diff --cached --check
      git commit \
        --message 'Create Spring Boot project foundation' \
        --message 'Provide a verified application foundation so attendees can focus on delivering supermarket features rather than project setup.'

  - type: Command
    commands: |
      rsync --archive '../fixtures/repository-overlays/002-repository-local-agent-skills/' .

      git add .agents
      git diff --cached --check
      git commit \
        --message 'Add repository-local agent skills' \
        --message 'Provide version-controlled local skills that support the workshop workflow and can be reviewed before use.'

  - type: Command
    commands: |
      rsync --archive '../fixtures/repository-overlays/003-seed-catalog-and-product-listing/' .
      rm -f src/main/java/demo/supermarket/home/HomeController.java src/main/resources/templates/home.html

      git add .
      git diff --cached --check
      git commit \
        --message 'Seed catalog categories and products' \
        --message 'Make a realistic product catalog available so shoppers can discover products and the workshop can build on meaningful business data.'

  - type: Command
    commands: |
      rsync --archive '../fixtures/repository-overlays/004-persisted-guest-cart/' .

      git add .
      git diff --cached --check
      git commit \
        --message 'Implement persisted guest carts' \
        --message 'Preserve a guest shopper’s selected items across requests so they can continue toward checkout without losing their basket.'

  - type: Command
    commands: |
      chmod +x mvnw
      ./mvnw clean verify
    timeout: 2 minutes

  - type: Markdown
    contents: |
      Publish the completed local history once. This does not create branches or pull
      requests.

  - type: Command
    commands: |
      repository='demo-supermarket-starter'
      if gh repo view "${repository}" --json nameWithOwner >/dev/null 2>&1; then
        gh repo delete "${repository}" --yes
      fi

  - type: Command
    commands: |
      gh repo \
        create 'demo-supermarket-starter' \
        --public \
        --source=. \
        --remote=origin \
        --push
