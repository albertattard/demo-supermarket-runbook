entries:
  - type: Heading
    level: H1
    title: "Building a Java feature with Codex: Demo Supermarket workshop"

  - type: Markdown
    contents: |
      Learn a practical, evidence-led workflow for using Codex while delivering a
      small Java change. You will clone `demo-supermarket-starter`, use Codex to
      inspect the codebase and assess `TASK-004`, establish layered `AGENTS.md`
      guidance, and implement and verify the task.

      Codex is a collaborator in this workshop: it can inspect the repository,
      propose changes, help make a task ready, and pass structured findings between
      steps. You remain responsible for the engineering decisions and for accepting
      the evidence.


  - type: Markdown
    contents: |
      ---

  - type: Heading
    level: H2
    title: Disclaimer

  - type: Markdown
    contents: |
      The examples provided in this repository are for **educational purposes only**
      and are intended to be used **exclusively within this workshop**. While every
      effort has been made to ensure accuracy and reliability, these examples are
      provided **“as is”**, without any warranties, express or implied.

      By using these examples, you acknowledge that you do so **at your own risk**.
      The authors and contributors shall **not be held liable** for any direct,
      indirect, incidental, or consequential damages resulting from the use, misuse,
      or inability to use these examples.

      It is the responsibility of the user to **review, test, and validate** any code
      before applying it in a production or commercial environment.

  - type: Heading
    level: H3
    title: Performance Disclaimer

  - type: Markdown
    contents: |
      The performance values shown in this workshop are for reference only and should
      not be treated as absolute. Results can vary depending on hardware, system
      configuration, runtime environment, and other factors. Readers are encouraged to
      conduct their own tests under controlled conditions to obtain accurate
      measurements relevant to their specific use case.

  - type: Markdown
    contents: |
      ---

  - type: Heading
    level: H2
    title: Learning objectives

  - type: Markdown
    contents: |
      By the end of this workshop, you can:

      - establish a healthy baseline for a Java/Maven repository before asking an
        agent to change it;
      - create and use cascading `AGENTS.md` files to give repository-wide and
        narrower task-specific guidance to Codex;
      - inspect a codebase and assess `TASK-004` with Codex, recording the decisions
        needed to make the task ready;
      - create or apply a focused project skill and use a structured output from one
        agent step as input to the next; and
      - create or apply a focused project skill, pass structured output from one agent
        step to the next, and configure a bounded automation that makes one scoped
        change, verifies it, and opens a pull request for human review; and
      - review a diff and Maven verification result to decide whether the proposed
        change is acceptable.

  - type: Heading
    level: H2
    title: Prerequisites and environment

  - type: Markdown
    contents: |
      You need Java 25 or newer, Git, and an authenticated GitHub CLI session. Your
      GitHub account must be able to create a fork of the canonical starter repository.
      These checks run when the facilitator publishes this guide; use them as the
      required local setup for the workshop.

  - type: Prerequisite
    checks:
      - kind: java
        name: Java 25+
        version: 25+
        contents: |
          Java 25 or newer is required to run the application's Maven verification.
        help: Install Java 25 or newer and make sure `java` is available on the PATH.
      - kind: command
        name: Git
        contents: |
          Git manages the local branches, worktrees, and commits created during the workshop.
        commands: |
          git --version
        assert:
          exit_code: 0
        help: Install Git and make sure `git` is available on the PATH.
      - kind: command
        name: Authenticated GitHub CLI
        contents: |
          The GitHub CLI creates the attendee fork and clone.
        commands: |
          gh auth status --active
        assert:
          exit_code: 0
        help: Authenticate the GitHub CLI with an account that can fork the canonical starter repository.
      - kind: command
        name: Codex CLI
        contents: |
          - [Codex CLI](https://developers.openai.com/codex/cli) or equivalent agentic
            tool
        commands: codex --version
        help: Install Codex CLI and make sure `codex` is available on your PATH.

  - type: Heading
    level: H2
    title: Repository and workflow design

  - type: Markdown
    contents: |
      This workshop uses the Demo Supermarket Java application as a realistic project
      context for learning how to work with Codex in day-to-day engineering.

      You will begin with an unfamiliar repository, establish a baseline, add
      cascading `AGENTS.md` guidance, inspect the codebase, create and use skills,
      assess a task brief, and review evidence produced by agent-assisted work.
      `TASK-004` is the worked example used to demonstrate task readiness and an
      implementation workflow; it is not the sole subject of the workshop.

      **Agent inputs:** Repository instructions, `AGENTS.md` files, code and tests,
      task briefs, project skills, and structured findings from earlier agent steps.

      **Evidence:** Command output, task-readiness records, agent summaries, diffs,
      Maven verification, and—where the automation exercise is used—a pull request
      for human review.

      **Human decision:** Decide whether the instructions, task, proposed change, and
      verification evidence are sufficient to proceed or accept the work.

      **Limits:** Codex can assist with engineering, task grooming, and bounded
      automation. It does not establish correctness, security, production readiness,
      or merge approval.

  - type: Heading
    level: H2
    title: Fork and clone the starter repository

  - type: Markdown
    contents: |
      Create your own fork of the Demo Supermarket starter repository, then clone it.
      All work in this workshop happens in that clone.

      The fork is owned by the GitHub account currently active in `gh`. If that is not
      the account you intend to use, see **Optional: choose a different GitHub account**
      below before continuing.

  - type: Command
    commands: |
      gh repo fork albertattard/demo-supermarket-starter \
        --fork-name demo-supermarket \
        --clone
    timeout: 5 minutes

  - type: ChangeDirectory
    path: demo-supermarket
    contents: |
      Work in the cloned fork for the remaining workshop steps.

  - type: Markdown
    contents: |
      Confirm that the clone points to your fork.

  - type: Command
    commands: |
      git remote -v
      gh repo view --json nameWithOwner --jq '.nameWithOwner'
    output:
      caption: |
        The `origin` remote and repository identity for your workshop fork.

  - type: Heading
    level: H3
    title: "Optional: choose a different GitHub account"

  - type: Markdown
    contents: |
      Use this only when multiple GitHub accounts are already authenticated with the
      GitHub CLI. The account selected here owns the fork created by the previous step.

  - type: Command
    commands: |
      gh auth switch \
        --hostname github.com \
        --user YOUR-GITHUB-LOGIN

      gh auth status --active --hostname github.com
    output:
      caption: |
        The GitHub account that will own the workshop fork.

  - type: Command
    commands: |
      owner="$(gh api user --jq '.login')"
      gh api --method PUT repos/${owner}/demo-supermarket/actions/permissions \
        --field enabled=true

  - type: Command
    commands: |
      owner="$(gh api user --jq '.login')"
      gh api --method PUT "repos/${owner}/demo-supermarket/branches/main/protection" --input - <<'JSON'
      {
        "required_status_checks": {
          "strict": true,
          "contexts": [
            "verify"
          ]
        },
        "enforce_admins": true,
        "required_pull_request_reviews": {
          "required_approving_review_count": 0,
          "dismiss_stale_reviews": true,
          "require_code_owner_reviews": false
        },
        "restrictions": null,
        "required_linear_history": false,
        "allow_force_pushes": false,
        "allow_deletions": false,
        "block_creations": false,
        "required_conversation_resolution": true,
        "lock_branch": false,
        "allow_fork_syncing": false
      }
      JSON

  - type: Heading
    level: H2
    title: Build the application

  - type: Command
    commands: |
      ./mvnw clean verify
    timeout: 10 minutes

  - type: Heading
    level: H2
    title: Understand the project

  - type: Markdown
    contents: |
      One especially useful prompt is to make Codex act as an **interactive guide**:

  - type: Command
    commands: |
      codex exec \
        --ephemeral \
        --sandbox read-only \
        --model 'gpt-5.6-luna' \
        --config 'model_reasoning_effort="low"' \
        --output-last-message '/tmp/codex-onboarding-guide.md' \
        - <<'EOF' > '/tmp/codex-onboarding-guide.log' 2>&1
      Act as my technical onboarding guide for this repository. Don’t overwhelm me with a complete codebase explanation. First establish the high-level mental model, then take me through one important subsystem at a time. At each stage, point me to specific files to inspect and give me 2–3 questions I should be able to answer from them. When useful, trace actual code paths rather than relying on README documentation.
      EOF
    cleanup: |
      rm -f '/tmp/codex-onboarding-guide.md'
      rm -f '/tmp/codex-onboarding-guide.log'
    timeout: 5 minutes

  - type: Markdown
    contents: |
      The model's response

  - type: DisplayFile
    path: /tmp/codex-onboarding-guide.md

  - type: Markdown
    contents: |
      A good way to use Codex for onboarding is to move from **map → architecture → execution → deep dive → contribution**. These prompts are designed so Codex can inspect the repository rather than just explain concepts generically.

      1. **Get the 10-minute overview**

         > Give me a practical onboarding overview of this repository. Explain what the project does, who/what consumes it, the major components, the main technologies/frameworks, and how the pieces fit together. Point me to the 5–10 files or directories I should understand first, and explain why each matters.

      2. **Build a mental model of the architecture**

         > Analyze this codebase and explain its architecture to a new engineer. Identify the major modules/services/layers, their responsibilities, dependencies between them, important interfaces, and where state/data is stored. Trace one representative request or workflow end-to-end through the system.

      3. **Explain the repository structure**

         > Walk me through the repository structure. For each important top-level directory, explain its purpose, what kinds of code live there, and whether I need to understand it immediately or can ignore it initially. Highlight generated code, third-party code, configuration, tests, build tooling, and deployment infrastructure.

      4. **Figure out how to run it**

         > Determine how I can build and run this project locally from a clean checkout. Inspect the repository rather than guessing. Give me the commands in order, explain prerequisites and environment variables, and point to the files where you found this information. Also explain how to run the tests and common developer workflows.

      5. **Find the important entry points**

         > Identify the main entry points into this application. Show me where execution starts and trace what happens during startup. Then identify the main runtime paths an engineer working on this project is likely to encounter.

      6. **Teach me the domain**

         > Teach me the domain model behind this project using the code as evidence. What are the most important concepts, entities, abstractions, and terminology? For each concept, point me to representative classes/files/functions. Explain relationships between them in plain English.

      7. **Understand the data flow**

         > Pick one important user action/API operation/workflow and trace it end-to-end through the codebase. Start at the external entry point and follow it through validation, business logic, persistence/external calls, and the response. Include file names and key functions/classes at each step.

      8. **Understand the tests**

         > Explain the testing strategy of this repository. Identify the test frameworks, unit/integration/end-to-end tests, fixtures and mocks, and how tests are organized. Show me 3 representative tests that would teach me the most about how this system is intended to behave.

      9. **Find the risky/complex parts**

         > Analyze the repository and identify the 5 areas that are hardest or riskiest for a new engineer to modify. For each, explain why it is complex, what assumptions or invariants I should understand, what tests protect it, and what mistakes a newcomer could easily make.

      10. **Give me an onboarding curriculum**

         > Create a 2-hour onboarding plan for this repository. Assume I’m a new engineer who needs to become productive quickly. Give me an ordered sequence of files, concepts, and code paths to study. For each step, tell me what question I should be able to answer before moving on. Avoid making me read the entire repository.

  - type: Heading
    level: H2
    title: Create the `AGENTS.md` file

  - type: Markdown
    contents: |
      Create the `AGENTS.md` file

      You can use the following TUI slash command when working with the OpenAI Codex desktop application

      > /init

      The TUI slash command does not work from the command line. Therefore, you need to be a bit more prescriptive.

  - type: Command
    commands: |
      codex exec \
        --ephemeral \
        --sandbox workspace-write \
        --model 'gpt-5.6-terra' \
        --config 'model_reasoning_effort="medium"' \
        --output-last-message '/tmp/codex-create-agents_md-file.md' \
        - <<'EOF' > '/tmp/codex-create-agents_md-file.log' 2>&1
      Create a concise `AGENTS.md` in the repository root with durable guidance for future agents. Keep it specific to this Java/Maven/Spring Boot application. Do not change any other files. Do not only describe the file: create it. Finally, verify that `AGENTS.md` exists.
      EOF
    cleanup: |
      rm -f '/tmp/codex-create-agents_md-file.md'
      rm -f '/tmp/codex-create-agents_md-file.log'
    timeout: 5 minutes

  - type: Markdown
    contents: |
      The newly created `AGENTS.md` file

  - type: DisplayFile
    path: demo-supermarket/AGENTS.md

  - type: Markdown
    contents: |
      Commit the changes once ready

  - type: Command
    commands: |
      # Create and switch to a branch for this change.
      git switch --create '004-create-agents_md-file'

      # Commit all changes.
      git add .
      git commit --message 'Create AGENTS.md file' \
                 --message 'Add repository guidance for coding agents'

      # Push this branch to GitHub and set its remote tracking branch.
      git push --set-upstream origin '004-create-agents_md-file'

      # Create the pull request and save its link for the merge helper.
      owner="$(gh api user --jq '.login')"
      pr_url_file='target/pr-004-create-agents_md-file.log'
      gh pr create \
        --repo "${owner}/demo-supermarket" \
        --base main \
        --head '004-create-agents_md-file' \
        --title 'Create AGENTS.md file' \
        --body 'Add repository guidance for coding agents' > "${pr_url_file}"
      cat "${pr_url_file}"

      # Wait for required checks, then merge without bypassing branch policy.
      ./tools/merge-pull-request.sh "${pr_url_file}"
      rm -f "${pr_url_file}"
    timeout: 15 minutes

