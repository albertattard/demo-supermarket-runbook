      TODO: Update description!
      > Use $review-task-readiness on @docs/tasks/TASK-004-guest-checkout-and-order-confirmation.md and update it to record my answers.

      This is a rehearsed example and all open questions are answered in advanced to enable unattended runs.

  - type: Command
    commands: |
      # Download the answers
      answers="$(
        curl \
          --location \
          --silent \
          --fail \
          'https://github.com/albertattard/demo-supermarket-runbook/raw/refs/heads/main/fixtures/prompts/TASK-004-readiness-decisions.md'
      )"

      # Construct the prompt
      codex_prompt="$(cat <<EOF
      Use \$review-task-readiness on docs/tasks/TASK-004-guest-checkout-and-order-confirmation.md and update it to record my answers.

      Read the readiness decisions below before reviewing TASK-004. Treat every listed answer as settled; do not re-ask those questions.

      <readiness-decisions>
      ${answers}
      </readiness-decisions>
      EOF
      )"

      # Call the model
      codex exec \
        --ephemeral \
        --sandbox workspace-write \
        --model 'gpt-5.6-terra' \
        --config 'model_reasoning_effort="medium"' \
        --output-last-message '/tmp/codex-review-next-task-readiness.md' \
        "${codex_prompt}" > '/tmp/codex-review-next-task-readiness.log' 2>&1
    cleanup: |
      rm -f '/tmp/codex-review-next-task-readiness.md'
      rm -f '/tmp/codex-review-next-task-readiness.log'
    timeout: 5 minutes

